name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG + ZIP
        run: npm run dist:mac -- --publish never
        env:
          # 未配置签名时允许打未签名包，用户安装时需在「隐私与安全性」中允许
          # 注意：未签名 mac 应用的自更新会被系统签名校验拦截，需配置签名后生效
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dasuantou-adapter-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="release/*.dmg release/*.zip release/latest-mac.yml release/*.blockmap"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload --clobber "${GITHUB_REF_NAME}" $FILES
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes $FILES || \
              gh release upload --clobber "${GITHUB_REF_NAME}" $FILES
          fi